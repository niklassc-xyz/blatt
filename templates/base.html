<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf4ed" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191724" media="(prefers-color-scheme: dark)">
  <title>{% block title %}Blatt{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/navigation.js" defer></script>
</head>
<body hx-history="false">
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="Blatt home">
      <span class="wordmark-mark" aria-hidden="true"></span>
      <strong>blatt</strong>
    </a>
    <nav aria-label="Primary navigation">
      <a{% if posts_nav_active %} class="active" aria-current="page"{% endif %} href="/">Posts</a>
      <a{% if feeds_nav_active %} class="active" aria-current="page"{% endif %} href="/feeds">Feeds</a>
      <a{% if sources_nav_active %} class="active" aria-current="page"{% endif %} href="/sources">Sources</a>
    </nav>
    <div class="header-actions">
      {% block header_actions %}{% endblock %}
    </div>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
