{% extends "base.html" %}

{% block title %}Sources - Local Reader{% endblock %}

{% block content %}
<main class="page-shell sources-page">
  <section class="page-header">
    <div>
      <p class="eyebrow">Manage subscriptions</p>
      <h1>Sources</h1>
    </div>
    <a class="text-link" href="/feeds">Browse feeds</a>
  </section>

  <section class="add-feed" aria-labelledby="add-feed-title">
    <div>
      <h2 id="add-feed-title">Add a source</h2>
      <p>RSS, Atom, and YouTube channel feeds are supported.</p>
    </div>
    <form method="post" action="/sources" hx-post="/sources" hx-target="#feed-list" hx-swap="outerHTML">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Feed URL<input type="url" name="url" placeholder="https://example.com/feed.xml" required></label>
      <label>Name<input type="text" name="name" placeholder="Example News" required></label>
      <label>Tags<input type="text" name="tags" placeholder="news, technology"></label>
      <button type="submit">Add feed</button>
    </form>
  </section>

  {% include "feed_list.html" %}

  <p class="config-note">Configuration file: <code>{{ config_path }}</code></p>
</main>
{% endblock %}
